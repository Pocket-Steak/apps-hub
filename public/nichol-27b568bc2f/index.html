<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Today's Time Until I Get to See You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;800&family=Press+Start+2P&family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --night-1: #0b0a24;
      --night-2: #1d1650;
      --night-3: #3b2470;
      --dusk: #b4507a;
      --gold: #f4cf6a;
      --gold-deep: #b8892c;
      --ice: #d9ecff;
      --stone: #3a3f4a;
      --grass: #5fae3b;
      --dirt: #8a5a33;
      --leaf: #7ccf6a;
      --cream: #fff6dc;
      --monster: #9fe870;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--cream);
      background: linear-gradient(180deg, var(--night-1) 0%, var(--night-2) 45%, var(--night-3) 75%, var(--dusk) 100%);
      font-family: "Fredoka", system-ui, sans-serif;
    }

    /* ---------- sky ---------- */
    .sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

    .star {
      position: absolute; width: 2px; height: 2px; border-radius: 50%;
      background: #fff; opacity: .8;
      animation: twinkle var(--t, 3s) ease-in-out infinite;
    }
    @keyframes twinkle { 50% { opacity: .15; transform: scale(.6); } }

    /* aurora — the northern sky */
    .aurora {
      position: absolute; top: -10%; left: -20%; width: 140%; height: 45%;
      background:
        radial-gradient(ellipse 40% 60% at 30% 50%, rgba(90, 255, 190, .22), transparent 70%),
        radial-gradient(ellipse 35% 50% at 65% 40%, rgba(120, 160, 255, .20), transparent 70%),
        radial-gradient(ellipse 30% 45% at 85% 60%, rgba(200, 110, 255, .16), transparent 70%);
      filter: blur(18px);
      animation: aurora 14s ease-in-out infinite alternate;
    }
    @keyframes aurora { to { transform: translateX(8%) skewX(-8deg); opacity: .7; } }

    /* full moon with bats */
    .moon {
      position: absolute; top: 3%; right: 3%;
      width: clamp(70px, 12vw, 130px); aspect-ratio: 1; border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, #fffbe8, #f3e4b0 60%, #d9c58a);
      box-shadow: 0 0 60px 18px rgba(255, 240, 190, .35);
    }
    .bat {
      position: absolute; width: 28px; height: 14px;
      animation: batfly var(--d, 9s) linear infinite; animation-delay: var(--delay, 0s);
    }
    .bat svg { width: 100%; height: 100%; animation: flap .25s ease-in-out infinite alternate; }
    @keyframes flap { to { transform: scaleY(.45); } }
    @keyframes batfly {
      0%   { transform: translate(0, 0); }
      25%  { transform: translate(-40px, 18px); }
      50%  { transform: translate(-10px, 40px); }
      75%  { transform: translate(30px, 14px); }
      100% { transform: translate(0, 0); }
    }

    /* dragon gliding across */
    .dragon {
      position: absolute; top: 20%; left: -300px; width: 280px;
      animation: glide 26s linear infinite;
      filter: drop-shadow(0 0 6px rgba(120, 170, 255, .45));
    }
    .dragon .dbody { animation: dbob 1.2s ease-in-out infinite; }
    @keyframes dbob { 0%, 100% { transform: translateY(4px); } 50% { transform: translateY(-4px); } }
    @keyframes glide {
      0%   { transform: translate(0, 0) rotate(-4deg); }
      50%  { transform: translate(calc(50vw + 110px), -40px) rotate(3deg); }
      100% { transform: translate(calc(100vw + 600px), 10px) rotate(-4deg); }
    }

    /* fireworks */
    .burst { position: absolute; width: 4px; height: 4px; }
    .burst i {
      position: absolute; left: 0; top: 0; width: 4px; height: 4px; border-radius: 50%;
      background: var(--c); box-shadow: 0 0 6px 1px var(--c);
      animation: spark 1.6s ease-out forwards;
    }
    @keyframes spark {
      0%   { transform: rotate(var(--a)) translateX(0); opacity: 1; }
      100% { transform: rotate(var(--a)) translateX(var(--r)) translateY(20px); opacity: 0; }
    }

    /* skyline: castle + blocks + village */
    .skyline { position: fixed; left: 0; right: 0; bottom: 0; pointer-events: none; }
    .skyline svg { display: block; width: 100%; height: auto; }

    /* ---------- content ---------- */
    main {
      position: relative; z-index: 2;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px 16px 34vh;
      text-align: center;
    }

    h1 {
      margin: 0 0 28px;
      max-width: 900px;
      font-family: "Cinzel Decorative", "Cinzel", serif;
      font-weight: 900;
      font-size: clamp(26px, 5.4vw, 58px);
      line-height: 1.15;
      letter-spacing: .5px;
      background: linear-gradient(180deg, #fff6cf 0%, var(--gold) 55%, var(--gold-deep) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 3px 0 rgba(0,0,0,.35)) drop-shadow(0 0 22px rgba(244, 207, 106, .35));
    }

    .clock {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(10px, 2.4vw, 26px);
      width: 100%; max-width: 980px;
    }

    .tile {
      position: relative;
      padding: clamp(16px, 3vw, 30px) 8px clamp(14px, 2.4vw, 22px);
      min-width: 0;
    }
    .num { line-height: 1; font-variant-numeric: tabular-nums; }
    .label { margin-top: 12px; text-transform: uppercase; letter-spacing: 2px; font-size: clamp(11px, 1.6vw, 15px); }

    /* HOURS — carved Nordic stone with ember-gold runes */
    .t-hours {
      background:
        linear-gradient(160deg, rgba(255,255,255,.08), rgba(0,0,0,.25)),
        repeating-linear-gradient(35deg, #4a505c 0 6px, #434955 6px 13px);
      border: 3px solid #23272f;
      border-radius: 10px 10px 40px 40px;
      box-shadow: inset 0 0 0 2px #6c7382, inset 0 0 24px rgba(0,0,0,.6), 0 10px 30px rgba(0,0,0,.45);
    }
    .t-hours::before, .t-hours::after {
      content: "ᚺ ᛟ ᚢ ᚱ"; position: absolute; left: 0; right: 0;
      font-family: serif; font-size: 11px; letter-spacing: 8px; color: rgba(160, 210, 255, .55);
    }
    .t-hours::before { top: 6px; }
    .t-hours::after { bottom: 6px; content: "ᛞ ᚱ ᚨ ᚷ ᛟ ᚾ"; }
    .t-hours .num {
      font-family: "Cinzel", serif; font-weight: 800;
      font-size: clamp(44px, 10vw, 110px);
      color: #cfe6ff;
      text-shadow: 0 0 14px rgba(120, 190, 255, .9), 0 2px 0 #1a1e26;
    }
    .t-hours .label { font-family: "Cinzel", serif; font-weight: 800; color: #b9c7da; }

    /* MINUTES — grass-topped block */
    .t-minutes {
      background:
        linear-gradient(var(--grass), var(--grass)) top / 100% 22% no-repeat,
        conic-gradient(from 90deg at 50% 50%, #7d5130 25%, #8f6038 0 50%, #7d5130 0 75%, #8f6038 0) 0 0 / 24px 24px;
      border: 4px solid #2a1c10;
      border-radius: 0;
      box-shadow: inset 0 -6px 0 rgba(0,0,0,.3), inset 0 6px 0 rgba(255,255,255,.15), 0 10px 30px rgba(0,0,0,.45);
      image-rendering: pixelated;
    }
    .t-minutes .num {
      font-family: "Press Start 2P", monospace;
      font-size: clamp(30px, 7.2vw, 78px);
      color: #fff;
      text-shadow: 4px 4px 0 #3b2a17;
      padding-top: 14%;
    }
    .t-minutes .label { font-family: "Press Start 2P", monospace; font-size: clamp(8px, 1.2vw, 11px); color: #ffe9b8; text-shadow: 2px 2px 0 #3b2a17; }

    /* SECONDS — cozy island leaf bubble */
    .t-seconds {
      background: radial-gradient(circle at 30% 20%, #fffaf0, #f6ebcf);
      border: 4px solid #e2cf9f;
      border-radius: 42% 58% 46% 54% / 52% 44% 56% 48%;
      box-shadow: 0 10px 0 #c9b27a, 0 18px 30px rgba(0,0,0,.4);
      animation: bob 3.2s ease-in-out infinite;
    }
    .t-seconds .leaf {
      position: absolute; top: -18px; left: 50%; width: 40px; height: 40px; margin-left: -20px;
    }
    .t-seconds .num {
      font-family: "Fredoka", sans-serif; font-weight: 700;
      font-size: clamp(44px, 10vw, 110px);
      color: #4a8f3a;
    }
    .t-seconds .label { font-weight: 700; color: #8a6b3b; }
    @keyframes bob { 50% { transform: translateY(-6px) rotate(-1deg); } }

    .tick { animation: pop .35s ease-out; }
    @keyframes pop { 0% { transform: scale(1.12); } 100% { transform: scale(1); } }

    .chip {
      margin-top: 28px;
      display: inline-flex; align-items: center; gap: 10px;
      padding: 10px 18px; border-radius: 999px;
      background: rgba(10, 8, 30, .55); border: 1px solid rgba(244, 207, 106, .45);
      font-family: "Cinzel", serif; font-weight: 600; letter-spacing: 1px;
      color: var(--gold); font-size: clamp(13px, 2vw, 16px);
      backdrop-filter: blur(4px);
    }
    .chip .bolt { color: var(--monster); }

    /* the moment */
    .arrived h1 { animation: glow 1.6s ease-in-out infinite alternate; }
    @keyframes glow { to { filter: drop-shadow(0 0 30px rgba(255, 220, 140, .9)); } }
    .reunion {
      display: none;
      font-family: "Cinzel Decorative", serif; font-weight: 900;
      font-size: clamp(34px, 8vw, 84px);
      color: #fff2c4;
      text-shadow: 0 0 24px rgba(255, 210, 120, .9);
    }
    .arrived .clock { display: none; }
    .arrived .reunion { display: block; }

    .chip { cursor: default; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }

    #editor {
      width: min(360px, calc(100vw - 32px));
      padding: 24px; border-radius: 18px;
      border: 1px solid rgba(244, 207, 106, .5);
      background: #17123a; color: var(--cream);
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
    }
    #editor::backdrop { background: rgba(5, 4, 18, .7); backdrop-filter: blur(3px); }
    #editor h2 { margin: 0 0 16px; font-family: "Cinzel", serif; font-weight: 800; color: var(--gold); font-size: 20px; }
    #editor label { display: block; margin-bottom: 14px; font-size: 14px; font-weight: 500; color: #d9d2ff; }
    #editor label[hidden] { display: none; }
    #editor input {
      display: block; width: 100%; margin-top: 6px; padding: 10px 12px;
      font: 600 16px "Fredoka", sans-serif; color: #fff;
      background: #0d0a26; border: 1px solid #4a3f8a; border-radius: 10px;
      color-scheme: dark;
    }
    #editMsg { min-height: 18px; margin: 0 0 12px; font-size: 13px; color: #ffb3c7; }
    .edit-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .edit-actions button {
      padding: 10px 18px; border-radius: 999px; border: 1px solid #4a3f8a;
      background: transparent; color: var(--cream); font: 600 15px "Fredoka", sans-serif; cursor: pointer;
    }
    .edit-actions .primary { background: var(--gold); border-color: var(--gold); color: #1d1650; }

    @media (max-width: 560px) {
      .clock { gap: 8px; }
      .label { letter-spacing: 1px; }
      .t-hours::before, .t-hours::after { letter-spacing: 3px; font-size: 9px; }
      .t-hours::after { display: none; }
      .dragon { width: 170px; }
      main { padding-bottom: 26vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .dragon { display: none; }
    }
  </style>
</head>

  <main id="app">
    <h1>Today's Time Until I Get to See You</h1>

    <div class="clock" role="timer" aria-live="off">
      <div class="tile t-hours">
        <div class="num" id="h">--</div>
        <div class="label">Hours</div>
      </div>
      <div class="tile t-minutes">
        <div class="num" id="m">--</div>
        <div class="label">Minutes</div>
      </div>
      <div class="tile t-seconds">
        <svg class="leaf" viewBox="0 0 40 40" aria-hidden="true">
          <path d="M20 36 C6 30 4 14 20 4 C36 14 34 30 20 36 Z" fill="#7ccf6a" stroke="#4a8f3a" stroke-width="2"/>
          <path d="M20 34 L20 10" stroke="#4a8f3a" stroke-width="2" fill="none"/>
        </svg>
        <div class="num" id="s">--</div>
        <div class="label">Seconds</div>
      </div>
    </div>

    <div class="reunion">See you now ❤</div>

    <div class="chip"><span class="bolt">⚡</span><span id="target">5:30 PM</span><span class="bolt">⚡</span></div>
  </main>

  <dialog id="editor">
    <form id="editForm" method="dialog">
      <h2>Change time</h2>
      <label>Day <input type="date" name="date" required /></label>
      <label>Time (Eastern) <input type="time" name="time" required /></label>
      <label id="passRow">Passcode <input type="password" name="passcode" autocomplete="current-password" /></label>
      <p id="editMsg" role="status"></p>
      <div class="edit-actions">
        <button type="button" id="editCancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script>
    const TZ = 'America/New_York';
    const SLUG = 'nichol-27b568bc2f';
    const API = '/api/countdown?slug=' + SLUG;

    function etParts(d) {
      return Object.fromEntries(
        new Intl.DateTimeFormat('en-US', {
          timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'
        }).formatToParts(d).map(p => [p.type, p.value])
      );
    }

    // A wall-clock date + time in Eastern Time, regardless of the viewer's device timezone.
    function etDate(ymd, hh, mm) {
      const [y, mo, d] = ymd.split('-').map(Number);
      const guess = new Date(Date.UTC(y, mo - 1, d, hh, mm));
      const p = etParts(guess);
      const offset = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute) - guess.getTime();
      return new Date(guess.getTime() - offset);
    }

    const todayET = () => { const p = etParts(new Date()); return `${p.year}-${p.month}-${p.day}`; };

    let target = etDate(todayET(), 17, 30);
    let canEdit = false;

    const chipText = document.getElementById('target');
    function showTarget() {
      const time = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' }).format(target);
      const p = etParts(target);
      const sameDay = `${p.year}-${p.month}-${p.day}` === todayET();
      chipText.textContent = sameDay ? time
        : new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric' }).format(target) + ' · ' + time;
    }

    async function loadTarget() {
      try {
        const r = await fetch(API, { cache: 'no-store' });
        const j = await r.json();
        canEdit = !!j.editor;
        if (j.target) { target = new Date(j.target); showTarget(); }
      } catch {}
    }

    const els = { h: document.getElementById('h'), m: document.getElementById('m'), s: document.getElementById('s') };
    const pad = n => String(n).padStart(2, '0');
    let last = {};

    function set(key, val) {
      if (last[key] === val) return;
      last[key] = val;
      const el = els[key];
      el.textContent = val;
      el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick');
    }

    function render() {
      const diff = target - Date.now();
      const app = document.getElementById('app');
      if (diff <= 0) {
        app.classList.add('arrived');
        if (!render.celebrating) render.celebrating = setInterval(firework, 450);
        return;
      }
      if (render.celebrating) { clearInterval(render.celebrating); render.celebrating = null; }
      app.classList.remove('arrived');
      const total = Math.floor(diff / 1000);
      set('h', String(Math.floor(total / 3600)));
      set('m', pad(Math.floor(total % 3600 / 60)));
      set('s', pad(total % 60));
    }

    // ---- sky dressing ----
    const stars = document.getElementById('stars');
    for (let i = 0; i < 120; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 65 + '%';
      s.style.setProperty('--t', (2 + Math.random() * 4) + 's');
      s.style.animationDelay = (-Math.random() * 5) + 's';
      if (Math.random() < .15) { s.style.width = s.style.height = '3px'; }
      stars.appendChild(s);
    }

    const bats = document.getElementById('bats');
    const batSVG = '<svg viewBox="0 0 28 14"><path d="M14 4 L12 1 L13 4 C9 0 4 0 0 4 C4 4 6 8 8 10 C10 7 12 8 14 13 C16 8 18 7 20 10 C22 8 24 4 28 4 C24 0 19 0 15 4 L16 1 Z" fill="#0b0a18"/></svg>';
    [[11, 82, 8], [16, 88, 11], [9, 76, 9.5]].forEach(([top, left, d], i) => {
      const b = document.createElement('div');
      b.className = 'bat';
      b.style.top = top + '%'; b.style.left = left + '%';
      b.style.setProperty('--d', d + 's'); b.style.setProperty('--delay', (-i * 2) + 's');
      b.innerHTML = batSVG;
      bats.appendChild(b);
    });

    const fw = document.getElementById('fireworks');
    const colors = ['#f4cf6a', '#ff7aa8', '#7fe3ff', '#9fe870', '#c59bff', '#ffffff'];
    function firework() {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const b = document.createElement('div');
      b.className = 'burst';
      b.style.left = (10 + Math.random() * 80) + '%';
      b.style.top = (8 + Math.random() * 35) + '%';
      const c = colors[Math.floor(Math.random() * colors.length)];
      const n = 18, r = 40 + Math.random() * 50;
      for (let i = 0; i < n; i++) {
        const p = document.createElement('i');
        p.style.setProperty('--a', (360 / n * i) + 'deg');
        p.style.setProperty('--r', r + 'px');
        p.style.setProperty('--c', c);
        b.appendChild(p);
      }
      fw.appendChild(b);
      setTimeout(() => b.remove(), 1800);
    }
    setInterval(firework, 2600);
    firework();

    showTarget();
    render();
    setInterval(render, 250);
    loadTarget();
    setInterval(loadTarget, 30000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) loadTarget(); });

    // ---- hidden editor: triple-tap the time badge ----
    const dlg = document.getElementById('editor');
    const form = document.getElementById('editForm');
    const msg = document.getElementById('editMsg');
    let taps = [];
    document.querySelector('.chip').addEventListener('click', () => {
      const now = Date.now();
      taps = taps.filter(t => now - t < 900).concat(now);
      if (taps.length < 3) return;
      taps = [];
      const p = etParts(target);
      form.date.value = `${p.year}-${p.month}-${p.day}`;
      form.time.value = `${p.hour}:${p.minute}`;
      form.passcode.value = '';
      document.getElementById('passRow').hidden = canEdit;
      msg.textContent = '';
      dlg.showModal();
    });
    document.getElementById('editCancel').addEventListener('click', () => dlg.close());

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const [hh, mm] = form.time.value.split(':').map(Number);
      const next = etDate(form.date.value, hh, mm);
      msg.textContent = 'Saving…';
      try {
        const r = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ target: next.toISOString(), passcode: form.passcode.value })
        });
        const j = await r.json();
        if (!r.ok) { msg.textContent = j.error || 'Couldn\'t save.'; return; }
        canEdit = true;
        target = new Date(j.target);
        showTarget(); render();
        dlg.close();
      } catch { msg.textContent = 'Couldn\'t reach the site.'; }
    });
  </script>
</body>
</html>
