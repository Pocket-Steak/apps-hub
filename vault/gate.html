<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Private — Pocket Steak StackD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #100e0c; --bg-soft: #181513; --ink: #ece6da; --ink-dim: #8a8278;
      --rule: #2a2520; --rule-hi: #3a3328; --accent: #ff4500; --accent-hi: #ff5d20;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .rail {
      border-bottom: 1px solid var(--rule); padding: 14px 28px;
      display: flex; align-items: center; justify-content: space-between;
      font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px;
      letter-spacing: 0.06em; color: var(--ink-dim); text-transform: uppercase;
    }
    .rail a { color: var(--ink-dim); text-decoration: none; display: flex; align-items: center; gap: 12px; }
    .rail a:hover { color: var(--ink); }
    .rail img { width: 22px; height: 22px; object-fit: contain; }
    main { flex: 1; display: grid; place-items: center; padding: 48px 16px; }
    .gate { width: 100%; max-width: 380px; }
    .mark {
      display: block; height: 120px; margin: 0 auto 28px;
      animation: markDrop 1.3s cubic-bezier(0.2, 0.75, 0.2, 1) both;
    }
    @keyframes markDrop {
      0%   { transform: translate3d(0, -60vh, 0) rotate(0deg); opacity: 0; }
      10%  { opacity: 1; }
      100% { transform: translate3d(0, 0, 0) rotate(720deg); opacity: 1; }
    }
    h1 {
      font-size: 56px; font-weight: 700; letter-spacing: -0.04em; text-align: center;
      margin-bottom: 28px; animation: fadeUp .7s .9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }
    h1 .accent { color: var(--accent); }
    form { display: flex; flex-direction: column; gap: 12px; animation: fadeUp .7s 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    input {
      width: 100%; padding: 14px 16px; background: var(--bg-soft); color: var(--ink);
      border: 1px solid var(--rule-hi); border-radius: 2px; font: 500 16px 'JetBrains Mono', monospace;
      letter-spacing: 0.2em; text-align: center; outline: none; transition: border-color .2s;
    }
    input:focus { border-color: var(--accent); }
    button {
      padding: 14px 16px; background: var(--accent); color: #140c08; border: 0; border-radius: 2px;
      font: 700 12px 'JetBrains Mono', monospace; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer;
      transition: background .2s;
    }
    button:hover, button:focus-visible { background: var(--accent-hi); }
    button:disabled { opacity: .6; cursor: wait; }
    .err { min-height: 18px; text-align: center; color: var(--accent-hi); font: 500 12px 'JetBrains Mono', monospace; }
    .shake { animation: shake .4s; }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
    @keyframes fadeUp { 0% { opacity: 0; transform: translate3d(0, 12px, 0); } 100% { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .mark, h1, form { animation: none; } }
  </style>
</head>
<body>
  <div class="rail">
    <a href="/apps/"><img src="/apps/pocket_steak_logo_ui.png" alt="" /><span>Pocket Steak — StackD</span></a>
  </div>
  <main>
    <div class="gate">
      <img class="mark" src="/apps/pocket_steak_logo_ui.png" alt="" />
      <h1>Private<span class="accent">.</span></h1>
      <form id="f" autocomplete="off">
        <input id="code" type="password" inputmode="text" autocomplete="current-password" placeholder="Passcode" aria-label="Passcode" autofocus required />
        <button id="go" type="submit">Unlock</button>
        <div class="err" id="err" role="alert"></div>
      </form>
    </div>
  </main>
  <script>
    const f = document.getElementById('f');
    const code = document.getElementById('code');
    const go = document.getElementById('go');
    const err = document.getElementById('err');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      go.disabled = true; err.textContent = '';
      try {
        const r = await fetch('/api/unlock', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ passcode: code.value })
        });
        if (r.ok) { location.replace('/vault'); return; }
        const d = await r.json().catch(() => ({}));
        err.textContent = d.error || 'Something went wrong.';
      } catch {
        err.textContent = 'No connection.';
      }
      go.disabled = false;
      code.value = '';
      f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
      code.focus();
    });
  </script>
</body>
</html>
