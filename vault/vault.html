<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Vault — Pocket Steak StackD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #100e0c; --bg-soft: #181513; --ink: #ece6da; --ink-soft: #cfc6b8; --ink-dim: #8a8278;
      --rule: #2a2520; --rule-hi: #3a3328; --accent: #ff4500; --accent-hi: #ff5d20; --ok: #5fd38a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    body { min-height: 100vh; }
    .rail {
      border-bottom: 1px solid var(--rule); padding: 14px 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px;
      letter-spacing: 0.06em; color: var(--ink-dim); text-transform: uppercase;
    }
    .rail a { color: var(--ink-dim); text-decoration: none; }
    .rail a:hover { color: var(--ink); }
    .brand { display: flex; align-items: center; gap: 12px; color: var(--ink) !important; }
    .brand img { width: 22px; height: 22px; object-fit: contain; }
    .rail-right { display: flex; align-items: center; gap: 18px; }
    .lock { border: 1px solid var(--rule-hi); padding: 6px 10px; border-radius: 2px; }
    .lock:hover { color: var(--accent) !important; border-color: var(--accent); }
    .net { display: inline-flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-dim); }
    .net.on .dot { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
    .net.off .dot { background: var(--accent); }

    .hero { padding: 72px 28px 40px; overflow: hidden; }
    .hero h1 { font-size: clamp(56px, 11vw, 148px); font-weight: 700; letter-spacing: -0.045em; line-height: .9; }
    .hero h1 .accent { color: var(--accent); }
    .hero h1 .char { display: inline-block; white-space: pre; }
    body.m-fall .hero h1 .char { opacity: 0; animation: fall .85s cubic-bezier(0.18, 0.7, 0.2, 1) forwards; }
    body.m-slide .hero h1 .char { opacity: 0; animation: slide .9s cubic-bezier(0.22, 0.85, 0.2, 1) forwards; }
    @keyframes fall { 0% { transform: translate3d(0, -140%, 0); opacity: 0; } 55% { opacity: 1; } 100% { transform: none; opacity: 1; } }
    @keyframes slide { 0% { transform: translate3d(60vw, 0, 0); opacity: 0; } 35% { opacity: 1; } 100% { transform: none; opacity: 1; } }

    .section {
      border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
      padding: 14px 28px; display: flex; align-items: center; justify-content: space-between;
      font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--ink-dim);
    }
    .section h2 { color: var(--ink); font-weight: 700; font-size: 11px; letter-spacing: 0.16em; }
    .section button {
      background: none; border: 1px solid var(--rule-hi); color: var(--ink-dim); border-radius: 2px;
      font: inherit; letter-spacing: 0.1em; padding: 4px 8px; cursor: pointer;
    }
    .section button:hover { color: var(--accent); border-color: var(--accent); }

    .reveal { opacity: 0; animation: fadeUp .7s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }
    @keyframes fadeUp { 0% { opacity: 0; transform: translate3d(0, 12px, 0); } 100% { opacity: 1; transform: none; } }

    /* ── Dashboards ── */
    .dash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
    .dash {
      position: relative; display: block; color: inherit; text-decoration: none;
      border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
      padding: 16px; transition: background .2s;
    }
    .dash:hover { background: var(--bg-soft); }
    .dash-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; gap: 12px; }
    .dash-head b { font-size: 15px; font-weight: 600; }
    .dash-head span { font: 500 10.5px 'JetBrains Mono', monospace; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .1em; white-space: nowrap; }
    .dash:hover .dash-head span { color: var(--accent); }
    .screen {
      position: relative; aspect-ratio: 16 / 10; overflow: hidden; border-radius: 3px;
      background: #0a0908; border: 1px solid var(--rule);
    }
    .screen iframe {
      position: absolute; top: 0; left: 0; width: 1600px; height: 1000px; border: 0;
      transform-origin: 0 0; pointer-events: none; background: #0a0908;
    }
    .screen .veil {
      position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
      font: 500 11px 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim);
      background: repeating-linear-gradient(135deg, #0d0b0a 0 12px, #12100e 12px 24px);
    }
    .screen .veil i { display: block; font-style: normal; font-size: 22px; margin-bottom: 8px; color: var(--rule-hi); }
    .screen.live .veil { display: none; }

    /* ── Apps ── */
    .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    .app {
      display: flex; gap: 14px; align-items: flex-start; padding: 22px 22px 24px;
      border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
      color: inherit; text-decoration: none; transition: background .2s;
    }
    .app:hover { background: var(--bg-soft); }
    .app .emoji { font-size: 26px; line-height: 1; transition: transform .3s cubic-bezier(0.2, 0.7, 0.2, 1); }
    .app:hover .emoji { transform: rotate(-12deg) scale(1.15); }
    .app b { display: block; font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .app small { display: block; color: var(--ink-dim); font-size: 13px; line-height: 1.4; }

    footer {
      padding: 18px 28px; font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10.5px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.12em;
    }
    @media (max-width: 640px) {
      .rail, .section, .hero, footer { padding-left: 16px; padding-right: 16px; }
      .dash-grid, .app-grid { grid-template-columns: 1fr; }
      .rail .net-label { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero h1 .char, .reveal { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>
<body>
  <div class="rail">
    <a class="brand" href="/apps/"><img src="/apps/pocket_steak_logo_ui.png" alt="" /><span>Pocket Steak — StackD</span></a>
    <div class="rail-right">
      <span class="net" id="net"><span class="dot"></span><span class="net-label">Tailscale…</span></span>
      <a class="lock" href="/api/lock">Lock</a>
    </div>
  </div>

  <section class="hero">
    <h1><span class="word">The Vault</span><span class="accent">.</span></h1>
  </section>

  <div class="section reveal" style="animation-delay:1.1s">
    <h2>Dashboards</h2>
    <button type="button" id="retry">Recheck</button>
  </div>
  <div class="dash-grid reveal" id="dashes" style="animation-delay:1.25s"></div>

  <div class="section reveal" style="animation-delay:1.4s">
    <h2>Apps</h2>
  </div>
  <div class="app-grid reveal" id="apps" style="animation-delay:1.5s"></div>

  <footer>© 2026 Pocket Steak StackD</footer>

  <script>
    // Tailnet HTTPS on Never Idle (`tailscale serve`, tailnet only).
    const TS = 'https://never-idle.tail95c234.ts.net';

    // frame: false = the page refuses to be framed, so show a link tile only.
    const DASHBOARDS = [
      { name: 'Overwatch',        url: TS + ':8443/view/claude' },
      { name: 'Second Brain',     url: TS + ':8443/view/brain' },
      { name: 'Elite Edge Bets',  url: TS + ':8443/view/bets' },
      { name: 'Ops',              url: TS + ':8443/view/ops' },
      { name: 'Tracking',         url: TS + ':8443/view/tracking' },
      { name: 'Claude Pulse',     url: TS + ':8444/' },
      { name: 'PSS Meter',        url: TS + ':8448/' },
      { name: 'Wall settings',    url: TS + ':8443/settings' },
      // Portal for Athena, Iris and Vanta Ray Notes; it has its own sign-in and refuses framing.
      { name: 'Vanta Ray Apps',   url: TS + '/',      frame: false }
    ];

    const APPS = [
      { emoji: '🍳', name: 'Recipes',             desc: 'Recipe extractor', url: 'https://pocketsteak-recipes.vercel.app/' },
      { emoji: '🥫', name: 'Rations',             desc: 'Food & meal plans', url: 'https://rations2.vercel.app/' },
      { emoji: '🎯', name: 'Elite Edge',          desc: 'Bets', url: 'https://elite-edge-bets.com/' },
      { emoji: '🏢', name: 'PocketSteak HQ',      desc: 'HQ', url: 'https://pocketsteakhq.vercel.app/' },
      { emoji: '✅', name: 'Punchlist',           desc: 'Tickets', url: 'https://punchlist-iota.vercel.app/' },
      { emoji: '🔖', name: 'Bookmark',            desc: 'Saved links', url: 'https://bookmark-taupe-omega.vercel.app/' },
      { emoji: '🧬', name: 'My OC Vault',         desc: 'MyOC', url: 'https://www.myocvault.app/' },
      { emoji: '🧾', name: 'Bill Tracker',        desc: 'B.T.', url: 'https://b-t-ten.vercel.app/' },
      { emoji: '💳', name: 'DBill',               desc: 'Debt tracker', url: 'https://dbill-lake.vercel.app/' },
      { emoji: '🖤', name: 'Neon Black',          desc: 'neon-black-37', url: 'https://neon-black-37.vercel.app/' },
      { emoji: '🍋', name: 'PinkLimeade',         desc: 'pink-limeade', url: 'https://pink-limeade.vercel.app/' },
      { emoji: '⏳', name: 'Countdown',           desc: 'Timer', url: '/countdown/' }
    ];

    const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

    // ── Apps ──
    const appsBox = document.getElementById('apps');
    for (const a of APPS) {
      const card = el('a', 'app');
      card.href = a.url;
      if (!a.url.startsWith('/')) { card.target = '_blank'; card.rel = 'noopener'; }
      card.append(el('span', 'emoji', a.emoji));
      const txt = el('div');
      txt.append(el('b', null, a.name), el('small', null, a.desc));
      card.append(txt);
      appsBox.append(card);
    }

    // ── Dashboards ──
    const dashBox = document.getElementById('dashes');
    const screens = [];
    for (const d of DASHBOARDS) {
      const card = el('a', 'dash');
      card.href = d.url; card.target = '_blank'; card.rel = 'noopener';
      const head = el('div', 'dash-head');
      head.append(el('b', null, d.name), el('span', null, 'Open ↗'));
      const screen = el('div', 'screen');
      const veil = el('div', 'veil');
      const icon = el('i', null, '🔒');
      veil.append(icon, document.createTextNode('Tailscale only'));
      screen.append(veil);
      card.append(head, screen);
      dashBox.append(card);
      screens.push({ d, screen, veil });
    }

    function fit(screen) {
      const f = screen.querySelector('iframe');
      if (f) f.style.transform = `scale(${screen.clientWidth / 1600})`;
    }
    const ro = new ResizeObserver((entries) => entries.forEach((e) => fit(e.target)));

    function goLive() {
      for (const { d, screen, veil } of screens) {
        if (d.frame === false) { veil.lastChild.textContent = 'Open to view'; veil.firstChild.textContent = '↗'; continue; }
        if (screen.querySelector('iframe')) continue;
        const f = document.createElement('iframe');
        f.src = d.url; f.loading = 'lazy'; f.tabIndex = -1;
        f.setAttribute('aria-hidden', 'true');
        f.referrerPolicy = 'no-referrer';
        f.addEventListener('load', () => screen.classList.add('live'));
        screen.prepend(f);
        fit(screen); ro.observe(screen);
      }
    }

    const net = document.getElementById('net');
    async function probe() {
      net.className = 'net'; net.querySelector('.net-label').textContent = 'Tailscale…';
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 3500);
      let ok = false;
      try {
        await fetch(TS + ':8443/', { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal });
        ok = true;
      } catch {}
      clearTimeout(t);
      net.className = 'net ' + (ok ? 'on' : 'off');
      net.querySelector('.net-label').textContent = ok ? 'Tailscale on' : 'Tailscale off';
      if (ok) goLive();
    }
    document.getElementById('retry').addEventListener('click', probe);
    probe();

    // ── Wordmark motion, same as the public page ──
    document.querySelectorAll('.hero h1 .word, .hero h1 .accent').forEach((node) => {
      const text = node.textContent; node.textContent = '';
      for (const ch of text) node.append(el('span', 'char', ch));
    });
    const chars = [...document.querySelectorAll('.hero h1 .char')];
    const order = chars.map((_, i) => i).sort(() => Math.random() - 0.5);
    order.forEach((idx, step) => { chars[idx].style.animationDelay = (step * 0.07) + 's'; });
    let last = null;
    try { last = localStorage.getItem('ps_intro_mode'); } catch {}
    document.body.classList.add(last === 'm-fall' ? 'm-slide' : 'm-fall');
  </script>
</body>
</html>
